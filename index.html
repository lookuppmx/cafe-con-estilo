      </g>
    </symbol>
  </svg>

  <!-- Pantalla de inicio -->
  <section id="splash">
    <button id="open" type="button" aria-label="Abrir menú">
      <div class="logo"><svg><use href="#logo"/></svg></div>
    </button>
    <h1>Café con Estilo</h1>
    <p class="hint">Toca el logo para ver el menú</p>
  </section>

  <!-- Menú -->
  <div id="menu">
    <header>
      <div class="top">
        <div class="logo"><svg><use href="#logo"/></svg></div>
        <b>Café con Estilo</b>
      </div>
      <nav id="nav"></nav>
    </header>

    <main id="list"></main>

    <footer>Trabajado por LookUpp.mx</footer>
  </div>

  <script>
    /* ==========================================================
       DATOS DEL MENÚ
       - Para cambiar el orden, mueve el bloque completo de una categoría.
       - Para agregar foto a un platillo, pon la ruta en "foto",
         por ejemplo: foto: "fotos/latte.jpg"
       ========================================================== */
    const MENU = [
      {
        nombre: "Bebidas calientes", id: "calientes",
        items: [
          { nombre: "Mocha caliente",      detalle: "12 oz", precio: 110, foto: "" },
          { nombre: "Chocolate caliente",  detalle: "12 oz", precio: 99,  foto: "" },
          { nombre: "Americano caliente",  detalle: "12 oz", precio: 80,  foto: "" },
          { nombre: "Tisana caliente",     detalle: "12 oz", precio: 99,  foto: "" },
          { nombre: "Té caliente",         detalle: "12 oz", precio: 90,  foto: "" },
          { nombre: "Espresso caliente",   detalle: "12 oz", precio: 60,  foto: "" },
          { nombre: "Cappuccino caliente", detalle: "12 oz", precio: 99,  foto: "" },
          { nombre: "Chai caliente",       detalle: "12 oz", precio: 90,  foto: "" },
          { nombre: "Latte caliente",      detalle: "12 oz", precio: 95,  foto: "" }
        ]
      },
      {
        nombre: "Bebidas frías", id: "frias",
        items: [
          { nombre: "Refresco",          detalle: "600 ml", precio: 52,  foto: "" },
          { nombre: "Agua",              detalle: "600 ml", precio: 31,  foto: "" },
          { nombre: "Té frío",           detalle: "16 oz",  precio: 99,  foto: "" },
          { nombre: "Tisana fría",       detalle: "16 oz",  precio: 105, foto: "" },
          { nombre: "Soda italiana",     detalle: "16 oz",  precio: 99,  foto: "" },
          { nombre: "Chocolate frío",    detalle: "16 oz",  precio: 105, foto: "" },
          { nombre: "Latte frío",        detalle: "16 oz",  precio: 118, foto: "" },
          { nombre: "Chai frío",         detalle: "16 oz",  precio: 135, foto: "" },
          { nombre: "Mocha frío",        detalle: "16 oz",  precio: 125, foto: "" },
          { nombre: "Smoothie (agua)",   detalle: "16 oz",  precio: 125, foto: "" },
          { nombre: "Smoothie (leche)",  detalle: "16 oz",  precio: 135, foto: "" }
        ]
      },
      {
        nombre: "Frappés", id: "frappes",
        items: [
          { nombre: "Frappé original",        detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé moka",            detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé Oreo",            detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé vainilla",        detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé caramelo",        detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé especias vainilla", detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé chai especias",   detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé chai vainilla",   detalle: "16 oz", precio: 125, foto: "" },
          { nombre: "Frappé matcha",          detalle: "16 oz", precio: 135, foto: "" }
        ]
      },
      {
        nombre: "Desayunos", id: "desayunos",
        items: [
          { nombre: "Chilaquiles verdes con pollo", detalle: "Totopos con salsa verde", precio: 160, foto: "" },
          { nombre: "Chilaquiles rojos con pollo",  detalle: "Totopos con salsa roja",  precio: 160, foto: "" }
        ]
      },
      {
        nombre: "Sándwiches y tortas", id: "sandwiches",
        items: [
          { nombre: "Sándwich de jamón", detalle: "", precio: 127, foto: "" },
          { nombre: "Baguette de jamón", detalle: "", precio: 140, foto: "" },
          { nombre: "Cuernito de jamón", detalle: "", precio: 130, foto: "" },
          { nombre: "Torta de jamón",    detalle: "Jamón, lechuga, tomate, aguacate, crema y mostaza", precio: 130, foto: "" },
          { nombre: "Torta de pierna",   detalle: "", precio: 160, foto: "" }
        ]
      },
      {
        nombre: "Postres", id: "postres",
        items: [
          { nombre: "Rebanada de cheesecake", detalle: "1 rebanada", precio: 99, foto: "" },
          { nombre: "Rebanada de panqué",     detalle: "1 rebanada", precio: 55, foto: "" }
        ]
      }
    ];

    /* ==========================================================
       CÓDIGO (normalmente no hace falta editarlo)
       ========================================================== */
    const splash = document.getElementById("splash");
    const menu   = document.getElementById("menu");
    const nav    = document.getElementById("nav");
    const list   = document.getElementById("list");

    const placeholder = '<svg viewBox="0 0 320 320"><use href="#logo"/></svg>';

    function crearItem(item) {
      const imagen = item.foto
        ? `<img loading="lazy" alt="${item.nombre}" src="${item.foto}">`
        : placeholder;
      const detalle = item.detalle ? `<small>${item.detalle}</small>` : "";
      return `
        <div class="it">
          <div class="ph">${imagen}</div>
          <div class="tx"><strong>${item.nombre}</strong>${detalle}</div>
          <div class="pr">$${item.precio}</div>
        </div>`;
    }

    MENU.forEach(function (cat) {
      const link = document.createElement("a");
      link.href = "#" + cat.id;
      link.textContent = cat.nombre;
      link.dataset.id = cat.id;
      nav.appendChild(link);

      const seccion = document.createElement("section");
      seccion.id = cat.id;
      seccion.innerHTML = `<h2>${cat.nombre}</h2>` + cat.items.map(crearItem).join("");
      list.appendChild(seccion);
    });

    const links = nav.querySelectorAll("a");

    function marcarCategoriaActiva() {
      const y = window.scrollY + 120;
      let actual = MENU[0].id;
      MENU.forEach(function (cat) {
        if (document.getElementById(cat.id).offsetTop <= y) actual = cat.id;
      });
      links.forEach(function (link) {
        const activo = link.dataset.id === actual;
        link.classList.toggle("on", activo);
        if (activo && menu.style.display === "block") {
          nav.scrollTo({ left: link.offsetLeft - 16, behavior: "smooth" });
        }
      });
    }

    document.getElementById("open").onclick = function () {
      splash.style.display = "none";
      menu.style.display = "block";
      window.scrollTo(0, 0);
    };

    window.addEventListener("scroll", marcarCategoriaActiva);
    marcarCategoriaActiva();
  </script>

</body>
</html>
